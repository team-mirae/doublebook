[package]
name = "doublebook"
version = "0.1.0"
edition = "2024"
description = "Headless double-entry accounting library with a JSON API, a C ABI and a CLI."
license = "CC0-1.0"
repository = "https://github.com/team-mirae/doublebook"
publish = false

[lib]
path = "src/lib.rs"
crate-type = ["rlib", "staticlib"]

[[bin]]
name = "doublebook"
path = "src/main.rs"

[dependencies]
bigdecimal = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "v7", "serde"] }

[profile.release]
lto = true
